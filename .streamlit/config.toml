[theme]
base = "dark"
primaryColor = "#ffcc00"
backgroundColor = "#0b0e14"
secondaryBackgroundColor = "#141924"
textColor = "#f0f2f5"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true

[logger]
level = "info"
